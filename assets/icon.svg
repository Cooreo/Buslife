  <rect x="96" y="102" width="320" height="54" rx="14" fill="#090d16" stroke="#334155" stroke-width="4"/>
  <text x="256" y="138" font-family="monospace" font-weight="900" font-size="30" fill="#fbbf24" text-anchor="middle" letter-spacing="3">BUSLIFE PL</text>
  <!-- Bus body -->
