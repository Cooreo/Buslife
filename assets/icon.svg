  <line x1="170" y1="278" x2="215" y2="225" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="342" y1="278" x2="297" y2="225" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <!-- MPK/MZK stripe -->
  <path d="M104 316 L260 316 L285 296 L408 296 L408 326 L104 326 Z" fill="#ef4444"/>
  <path d="M275 326 L300 296 L335 296 L310 326 Z" fill="#10b981"/>
  <path d="M310 326 L335 296 L370 296 L345 326 Z" fill="#3b82f6"/>
