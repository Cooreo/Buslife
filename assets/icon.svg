  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="36" y="36" width="440" height="440" rx="88" fill="none" stroke="#fbbf24" stroke-width="6" stroke-opacity="0.28"/>
