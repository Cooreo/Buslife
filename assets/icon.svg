  <circle cx="128" cy="342" r="12" fill="#ffffff"/>
  <circle cx="384" cy="342" r="12" fill="#ffffff"/>
  <rect x="206" y="334" width="100" height="20" rx="5" fill="#1e293b"/>
  <text x="256" y="349" font-family="monospace" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">#007 CW</text>
  <!-- Wheels -->
  <rect x="116" y="356" width="54" height="44" rx="14" fill="#0f172a"/>
  <rect x="342" y="356" width="54" height="44" rx="14" fill="#0f172a"/>
  <!-- City badges -->
